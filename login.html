<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Connect+ | Cadastro</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 128 128'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%2338BDF8'/%3E%3Cstop offset='.5' stop-color='%232563EB'/%3E%3Cstop offset='1' stop-color='%231E3A8A'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='128' height='128' rx='34' fill='url(%23g)'/%3E%3Cpath d='M79.2 42.8A30 30 0 1 0 79.2 85.2' fill='none' stroke='%23fff' stroke-width='13' stroke-linecap='round'/%3E%3Cpath d='M30 86L22 108L48 96Z' fill='%23fff' stroke='%23fff' stroke-width='6' stroke-linejoin='round'/%3E%3Crect x='87' y='52' width='9' height='26' rx='4.5' fill='%23A5F3FC'/%3E%3Crect x='78.5' y='60.5' width='26' height='9' rx='4.5' fill='%23A5F3FC'/%3E%3C/svg%3E">

    <link rel="stylesheet" href="sty.css">
</head>

<body>

    <main class="container">

        <!-- Logo Connect+ (SVG embutido, sem arquivo externo) -->
        <div class="logo" role="img" aria-label="Connect+">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 128">
                <defs>
                    <linearGradient id="logoBg" x1="0" y1="0" x2="1" y2="1">
                        <stop offset="0" stop-color="#38BDF8"/>
                        <stop offset="0.5" stop-color="#2563EB"/>
                        <stop offset="1" stop-color="#1E3A8A"/>
                    </linearGradient>
                    <clipPath id="logoClip">
                        <rect width="128" height="128" rx="34"/>
                    </clipPath>
                </defs>

                <rect width="128" height="128" rx="34" fill="url(#logoBg)"/>

                <!-- círculos de fundo, recortados dentro do quadrado -->
                <g clip-path="url(#logoClip)">
                    <circle cx="104" cy="22" r="26" fill="#fff" fill-opacity="0.10"/>
                    <circle cx="20" cy="112" r="30" fill="#fff" fill-opacity="0.08"/>
                </g>

                <!-- balão em forma de C -->
                <path d="M79.2 42.8 A30 30 0 1 0 79.2 85.2" fill="none" stroke="#fff" stroke-width="13" stroke-linecap="round"/>
                <path d="M30 86 L22 108 L48 96 Z" fill="#fff" stroke="#fff" stroke-width="6" stroke-linejoin="round"/>

                <!-- sinal de + -->
                <rect x="87" y="52" width="9" height="26" rx="4.5" fill="#A5F3FC"/>
                <rect x="78.5" y="60.5" width="26" height="9" rx="4.5" fill="#A5F3FC"/>

                <!-- brilho -->
                <path d="M100 24 L103 32 L111 35 L103 38 L100 46 L97 38 L89 35 L97 32 Z" fill="#fff"/>

                <!-- nome -->
                <text x="148" y="82" font-family="'Segoe UI', Arial, Helvetica, sans-serif" font-size="62" font-weight="700" fill="#ffffff" letter-spacing="-1.5">Connect<tspan fill="#38BDF8">+</tspan></text>
            </svg>
        </div>

        <div class="header">
            <h1>Crie sua conta</h1>
            <p>Preencha seus dados para começar</p>
        </div>

        <div class="mensagem" id="mensagem">
            Conta criada com sucesso! ✓
        </div>

        <form id="formulario">

            <div class="campo">
                <label for="nome">Nome completo</label>

                <div class="input-box">
                    <span class="icone">👤</span>

                    <input
                        type="text"
                        id="nome"
                        class="input-com-icone"
                        placeholder="Digite seu nome completo"
                        required
                    >
                </div>
            </div>

            <div class="campo">
                <label for="telefone">Telefone</label>

                <div class="input-box">
                    <span class="icone">📱</span>

                    <input
                        type="tel"
                        id="telefone"
                        class="input-com-icone"
                        placeholder="(00) 00000-0000"
                        maxlength="15"
                        required
                    >
                </div>
            </div>

            <div class="campo">
                <label for="email">E-mail</label>

                <div class="input-box">
                    <span class="icone">✉</span>

                    <input
                        type="email"
                        id="email"
                        class="input-com-icone"
                        placeholder="Digite seu e-mail"
                        required
                    >
                </div>
            </div>

            <div class="campo">
                <label for="senha">Senha</label>

                <div class="input-box">
                    <span class="icone">🔒</span>

                    <input
                        type="password"
                        id="senha"
                        class="input-com-icone"
                        placeholder="Crie uma senha"
                        required
                    >

                    <button
                        type="button"
                        class="senha-botao"
                        onclick="mostrarSenha('senha', this)"
                    >
                        👁
                    </button>
                </div>
            </div>

            <div class="campo">
                <label for="confirmarSenha">Confirmar senha</label>

                <div class="input-box">
                    <span class="icone">🔐</span>

                    <input
                        type="password"
                        id="confirmarSenha"
                        class="input-com-icone"
                        placeholder="Digite a senha novamente"
                        required
                    >

                    <button
                        type="button"
                        class="senha-botao"
                        onclick="mostrarSenha('confirmarSenha', this)"
                    >
                        👁
                    </button>
                </div>
            </div>

            <div class="termos">

                <input type="checkbox" id="termos" required>

                <label for="termos">
                    Li e aceito os
                    <a href="#">Termos de Uso</a>
                    e a
                    <a href="#">Política de Privacidade</a>.
                </label>

            </div>

            <button class="btn" type="submit">
                Criar minha conta →
            </button>

        </form>

        <div class="footer">
            © 2026 <strong>Connect+</strong> · Atendimento inteligente
        </div>

    </main>

    <script>

        // Mostrar e esconder senha
        function mostrarSenha(id, botao) {

            const campo = document.getElementById(id);

            if (campo.type === "password") {

                campo.type = "text";
                botao.textContent = "🙈";

            } else {

                campo.type = "password";
                botao.textContent = "👁";

            }
        }

        // Máscara do telefone
        const telefone = document.getElementById("telefone");

        telefone.addEventListener("input", function () {

            let valor = telefone.value.replace(/\D/g, "");

            if (valor.length > 11) {
                valor = valor.substring(0, 11);
            }

            if (valor.length > 6) {

                telefone.value =
                    "(" +
                    valor.substring(0, 2) +
                    ") " +
                    valor.substring(2, 7) +
                    "-" +
                    valor.substring(7);

            } else if (valor.length > 2) {

                telefone.value =
                    "(" +
                    valor.substring(0, 2) +
                    ") " +
                    valor.substring(2);

            } else {

                telefone.value = valor;

            }

        });

        // Envio do formulário
        const formulario = document.getElementById("formulario");

        formulario.addEventListener("submit", function (event) {

            event.preventDefault();

            const senha = document.getElementById("senha").value;

            const confirmarSenha =
                document.getElementById("confirmarSenha").value;

            const mensagem =
                document.getElementById("mensagem");

            if (senha !== confirmarSenha) {

                alert("As senhas não são iguais!");

                return;
            }

            if (senha.length < 6) {

                alert("A senha precisa ter pelo menos 6 caracteres!");

                return;
            }

            mensagem.style.display = "block";

            formulario.reset();

        });

    </script>

</body>
</html>
