<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Connect+ | Entrar ou Cadastrar</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 128 128'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%2338BDF8'/%3E%3Cstop offset='.5' stop-color='%232563EB'/%3E%3Cstop offset='1' stop-color='%231E3A8A'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='128' height='128' rx='34' fill='url(%23g)'/%3E%3Cpath d='M79.2 42.8A30 30 0 1 0 79.2 85.2' fill='none' stroke='%23fff' stroke-width='13' stroke-linecap='round'/%3E%3Cpath d='M30 86L22 108L48 96Z' fill='%23fff' stroke='%23fff' stroke-width='6' stroke-linejoin='round'/%3E%3Crect x='87' y='52' width='9' height='26' rx='4.5' fill='%23A5F3FC'/%3E%3Crect x='78.5' y='60.5' width='26' height='9' rx='4.5' fill='%23A5F3FC'/%3E%3C/svg%3E">

    <link rel="stylesheet" href="sty.css">
</head>

<body>

    <main class="container">

        <!-- Logo Connect+ (SVG embutido, sem arquivo externo) -->
        <div class="logo" role="img" aria-label="Connect+">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 128">
                <defs>
                    <linearGradient id="logoBg" x1="0" y1="0" x2="1" y2="1">
                        <stop offset="0" stop-color="#38BDF8"/>
                        <stop offset="0.5" stop-color="#2563EB"/>
                        <stop offset="1" stop-color="#1E3A8A"/>
                    </linearGradient>
                    <clipPath id="logoClip">
                        <rect width="128" height="128" rx="34"/>
                    </clipPath>
                </defs>

                <rect width="128" height="128" rx="34" fill="url(#logoBg)"/>

                <g clip-path="url(#logoClip)">
                    <circle cx="104" cy="22" r="26" fill="#fff" fill-opacity="0.10"/>
                    <circle cx="20" cy="112" r="30" fill="#fff" fill-opacity="0.08"/>
                </g>

                <path d="M79.2 42.8 A30 30 0 1 0 79.2 85.2" fill="none" stroke="#fff" stroke-width="13" stroke-linecap="round"/>
                <path d="M30 86 L22 108 L48 96 Z" fill="#fff" stroke="#fff" stroke-width="6" stroke-linejoin="round"/>

                <rect x="87" y="52" width="9" height="26" rx="4.5" fill="#A5F3FC"/>
                <rect x="78.5" y="60.5" width="26" height="9" rx="4.5" fill="#A5F3FC"/>

                <path d="M100 24 L103 32 L111 35 L103 38 L100 46 L97 38 L89 35 L97 32 Z" fill="#fff"/>

                <text x="148" y="82" font-family="'Segoe UI', Arial, Helvetica, sans-serif" font-size="62" font-weight="700" fill="#ffffff" letter-spacing="-1.5">Connect<tspan fill="#38BDF8">+</tspan></text>
            </svg>
        </div>

        <!-- Abas: Entrar / Criar conta -->
        <div class="abas" role="tablist">
            <button type="button" class="aba ativa" id="abaLogin" role="tab" aria-selected="true" data-modo="login">Entrar</button>
            <button type="button" class="aba" id="abaCadastro" role="tab" aria-selected="false" data-modo="cadastro">Criar conta</button>
        </div>

        <div class="header">
            <h1 id="tituloPagina">Entrar na sua conta</h1>
            <p id="subtituloPagina">Use seu número e sua senha para acessar</p>
        </div>

        <div class="mensagem" id="mensagem">
            Conta criada com sucesso! ✓
        </div>

        <!-- ================= LOGIN ================= -->
        <form id="formularioLogin" class="painel">

            <div class="campo">
                <label for="loginNumero">Número</label>

                <div class="input-box">
                    <span class="icone">📱</span>

                    <input
                        type="tel"
                        id="loginNumero"
                        class="input-com-icone"
                        placeholder="(00) 00000-0000"
                        maxlength="15"
                        autocomplete="tel"
                        required
                    >
                </div>
            </div>

            <div class="campo">
                <label for="loginSenha">Senha</label>

                <div class="input-box">
                    <span class="icone">🔒</span>

                    <input
                        type="password"
                        id="loginSenha"
                        class="input-com-icone"
                        placeholder="Digite sua senha"
                        autocomplete="current-password"
                        required
                    >

                    <button
                        type="button"
                        class="senha-botao"
                        onclick="mostrarSenha('loginSenha', this)"
                    >
                        👁
                    </button>
                </div>
            </div>

            <div class="termos">
                <input type="checkbox" id="termosLogin" required>

                <label for="termosLogin">
                    Li e aceito os
                    <a href="termos.html#termos">Termos de Uso</a>
                    e a
                    <a href="termos.html#privacidade">Política de Privacidade</a>.
                </label>
            </div>

            <div class="termos">
                <input type="checkbox" id="lembrarLogin">

                <label for="lembrarLogin">
                    Manter meu acesso neste aparelho.
                </label>
            </div>

            <div class="termos">
                <input type="checkbox" id="termosDados" required>

                <label for="termosDados">
                    Confirmo que sou o titular desta conta e que meu número poderá ser usado para identificar meu acesso.
                </label>
            </div>

            <button class="btn" type="submit" id="btnLogin">
                Entrar →
            </button>

            <p class="troca">
                Ainda não tem conta?
                <a href="#" id="irCadastro">Criar conta</a>
            </p>

        </form>

        <!-- ================= CADASTRO ================= -->
        <form id="formulario" class="painel" style="display: none;">

            <div class="campo">
                <label for="nome">Nome completo</label>

                <div class="input-box">
                    <span class="icone">👤</span>

                    <input
                        type="text"
                        id="nome"
                        class="input-com-icone"
                        placeholder="Digite seu nome completo"
                        required
                    >
                </div>
            </div>

            <div class="campo">
                <label for="telefone">Telefone</label>

                <div class="input-box">
                    <span class="icone">📱</span>

                    <input
                        type="tel"
                        id="telefone"
                        class="input-com-icone"
                        placeholder="(00) 00000-0000"
                        maxlength="15"
                        required
                    >
                </div>
            </div>

            <div class="campo">
                <label for="email">E-mail</label>

                <div class="input-box">
                    <span class="icone">✉</span>

                    <input
                        type="email"
                        id="email"
                        class="input-com-icone"
                        placeholder="Digite seu e-mail"
                        required
                    >
                </div>
            </div>

            <div class="campo">
                <label for="senha">Senha</label>

                <div class="input-box">
                    <span class="icone">🔒</span>

                    <input
                        type="password"
                        id="senha"
                        class="input-com-icone"
                        placeholder="Crie uma senha"
                        required
                    >

                    <button
                        type="button"
                        class="senha-botao"
                        onclick="mostrarSenha('senha', this)"
                    >
                        👁
                    </button>
                </div>
            </div>

            <div class="campo">
                <label for="confirmarSenha">Confirmar senha</label>

                <div class="input-box">
                    <span class="icone">🔐</span>

                    <input
                        type="password"
                        id="confirmarSenha"
                        class="input-com-icone"
                        placeholder="Digite a senha novamente"
                        required
                    >

                    <button
                        type="button"
                        class="senha-botao"
                        onclick="mostrarSenha('confirmarSenha', this)"
                    >
                        👁
                    </button>
                </div>
            </div>

            <div class="termos">

                <input type="checkbox" id="termos" required>

                <label for="termos">
                    Li e aceito os
                    <a href="termos.html#termos">Termos de Uso</a>
                    e a
                    <a href="termos.html#privacidade">Política de Privacidade</a>.
                </label>
            </div>
            <p id="erro" class="erro" role="alert" style="color: white; margin-bottom: 16px;"></p>
            <button class="btn" type="submit">
                Criar minha conta →
            </button>

            <p class="troca">
                Já tem conta?
                <a href="#" id="irLogin">Entrar</a>
            </p>

        </form>

        <div class="footer">
            © 2026 <strong>Connect+</strong> · Atendimento inteligente
        </div>

    </main>
    
    <script src="js/util.js"></script>
    <script src="login.js"></script>
    <script src="js/storage.js"></script>
    <script src="js/api.js"></script>
    <script src="js/auth.js"></script>
</body>
</html>
